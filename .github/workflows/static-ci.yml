name: static repository contract

on:
  push:
    branches: [main, "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Immutable pins and gitlinks
        run: python -m unittest discover -s tests -p 'test_repository_contract.py' -v
