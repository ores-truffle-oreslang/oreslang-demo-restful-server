name: REST demo input gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Existing route-publication regressions run in their separate workflow.
      # Avoid adding new Python dependencies while tools migrate to Rust.
      - name: Verify exact source checkout (host-only)
        shell: bash
        env:
          EXPECTED_DEMO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEMO_SHA"
      - name: Validate setup and submodule trust guards
        run: bash scripts/test-guards.sh
      - name: Refuse symlinked source handlers
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find src/routes/rest -type l -print -quit)"
          test "$(find src/routes/rest -type f -name '*.ores' | wc -l)" -ge 6
          while IFS= read -r -d '' file; do
            test -s "$file"
          done < <(find src/routes/rest -type f -name '*.ores' -print0)
